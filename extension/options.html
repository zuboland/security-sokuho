<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>緊急セキュリティ速報 — 設定</title>
<style>
  body { margin:0; padding:16px; width:420px; font:14px/1.6 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; color:#1a1a1a; background:#fff; }
  h1 { font-size:16px; margin:0 0 12px; }
  label { display:block; margin:12px 0 4px; font-weight:700; }
  input[type=url] { width:100%; box-sizing:border-box; padding:8px; border:1px solid #ccc; border-radius:6px; font-size:13px; }
  .muted { color:#666; font-size:12px; }
  .row { display:flex; gap:8px; align-items:center; margin-top:12px; }
  button { padding:8px 12px; border:1px solid #ccc; border-radius:6px; background:#fff; cursor:pointer; }
  button.primary { background:#1a1a1a; color:#fff; border-color:#1a1a1a; }
  #msg { margin-top:8px; font-size:12px; color:#2E7D32; }
</style>
</head>
<body>
<h1>設定</h1>
<label><input type="checkbox" id="notify"> 要対応のときにOSの通知を出す</label>
<p class="muted">通知は「悪用が確認された脆弱性」で「あなたの版数が影響を受ける」ときだけ。1件につき1回です。</p>
<label for="feedBase">速報の配信元（https・末尾 /）</label>
<input type="url" id="feedBase" placeholder="https://zuboland.github.io/security-sokuho/">
<p class="muted">自分でフィードを公開している場合に変えます。通常はそのままで構いません。</p>
<div class="row">
  <button id="save" class="primary">保存</button>
  <button id="reset">既定に戻す</button>
  <button id="test">通知の見た目を試す</button>
</div>
<div id="msg"></div>
<p class="muted" style="margin-top:16px">この拡張が外へ送る通信は、公開フィード（静的JSON）の取得だけです。あなたのブラウザの情報は外に出しません。</p>
<script type="module" src="options.js"></script>
</body>
</html>
